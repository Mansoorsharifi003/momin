{% extends 'ledger/base.html' %}
{% block content %}
<div class="panel" style="max-width:560px;margin:0 auto">
  <h3>Settings</h3>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="field"><label>{{ field.label }}</label>{{ field }}</div>
    {% endfor %}
    <button class="btn btn-gold" type="submit" style="width:100%">Save Settings</button>
  </form>
</div>
{% endblock %}
