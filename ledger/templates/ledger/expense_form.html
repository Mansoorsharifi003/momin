{% extends 'ledger/base.html' %}
{% block content %}
<div class="panel" style="max-width:560px;margin:0 auto">
  <h3>{{ title }}</h3>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="field"><label>{{ field.label }}</label>{{ field }}
        {% if field.errors %}<small class="neg">{{ field.errors.0 }}</small>{% endif %}</div>
    {% endfor %}
    <button class="btn btn-gold" type="submit" style="width:100%">Save</button>
  </form>
</div>
{% endblock %}
